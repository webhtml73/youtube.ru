<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>YouTube</title>
  <style>
    body {
      background: #f1f1f1;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Шапка */
    #header {
      background: #fff;
      border-bottom: 1px solid #ccc;
      padding: 8px 12px;
    }
    #logo {
      font-weight: bold;
      font-size: 24px;
      color: #ff0000;
      text-decoration: none;
    }
    #search-box {
      display: inline-block;
      margin-left: 16px;
    }
    #search-box input {
      border: 1px solid #999;
      padding: 4px 6px;
      width: 220px;
    }
    #search-box button {
      border: 1px solid #666;
      background: #eee;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* Сайдбар */
    #sidebar {
      float: left;
      width: 180px;
      padding: 12px;
    }
    .sidebar-section {
      margin-bottom: 14px;
    }
    .sidebar-section h4 {
      font-size: 13px;
      margin: 8px 0 6px 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
    .sidebar-section ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar-section li {
      margin: 4px 0;
    }
    .sidebar-section a {
      text-decoration: none;
      color: #0066cc;
      font-size: 13px;
    }
    .sidebar-section a:hover {
      text-decoration: underline;
    }

    /* Основная область */
    #main {
      margin-left: 200px;
      padding: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
    }

    /* Карточка видео */
    .video-card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 12px;
      width: 640px;
    }
    .video-card h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }
    .video-player-wrapper {
      position: relative;
      width: 640px;
      height: 360px;
      background: #000;
      overflow: hidden;
      cursor: pointer; /* показывает, что можно кликнуть */
    }
    video {
      width: 100%;
      height: 100%;
    }
    .player-controls-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      background: #fff;
      border: 1px solid #aaa;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #333;
    }
    .btn:hover {
      border-color: #666;
    }
    .channel-info {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }
    .channel-name {
      color: #0066cc;
      font-weight: bold;
    }

    /* Модальное окно плеера (полноэкранный режим) */
    #modal-overlay {
      display: none; /* скрыто по умолчанию */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #modal-overlay.active {
      display: flex;
    }
    #modal-player {
      width: 854px;
      height: 480px;
      background: #000;
      position: relative;
    }
    #modal-video {
      width: 100%;
      height: 100%;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-title {
      position: absolute;
      top: 10px;
      left: 15px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      #sidebar { display: none; }
      #main { margin-left: 0; }
      .video-card, .video-player-wrapper, #modal-player {
        width: 100%;
        max-width: 640px;
        height: auto;
        aspect-ratio: 16/9;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div id="header">
    <a href="#" id="logo">YouTube</a>
    <span id="search-box">
      <input type="text" placeholder="Поиск видео">
      <button>Найти</button>
    </span>
    <button><a href="studio.html">Перейти в студию</a></button>
  </div>

  <!-- Сайдбар -->
  <div id="sidebar">
    <div class="sidebar-section">
      <h4>Навигация</h4>
      <ul>
        <li><a href="#">Главная</a></li>
        <li><a href="#">Подписки</a></li>
        <li><a href="#">Избранное</a></li>
      </ul>
    </div>
    <div class="sidebar-section">
      <h4>Каналы</h4>
      <ul>
        <li><a href="#">Лучшие каналы</a></li>
        <li><a href="#">Новые каналы</a></li>
      </ul>
    </div>
  </div>

  <div id="main">
    <div class="video-card">
      <h3>Мое первое видео</h3>

      <!-- Плеер в карточке -->
      <div class="video-player-wrapper" onclick="openModal('videos/video1.mp4', 'Мое первое видео')">
        <video src="videos/video-001.mp4" poster="videos/poster1.jpg" muted playsinline></video>
        
        <div class="player-controls-overlay">
          <button class="btn btn-like" onclick="event.stopPropagation(); toggleLike(this)">Лайк</button>
          <button class="btn btn-subscribe" onclick="event.stopPropagation(); subscribe()">Подписаться</button>
        </div>
      </div>

      <div class="channel-info">
        Канал: <span class="channel-name">FreshHappyRBX</span>
      </div>
    </div>
  </div>

  <!-- Модальное окно (медиаплеер) -->
  <div id="modal-overlay">
    <div id="modal-player">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <span class="modal-title" id="modal-title">Видео</span>
      <video id="modal-video" src="" controls></video>
    </div>
  </div>

  <script>
    // Открыть модальное окно с видео
    function openModal(src, title) {
      const overlay = document.getElementById('modal-overlay');
      const video = document.getElementById('modal-video');
      const titleEl = document.getElementById('modal-title');

      video.src = src;
      titleEl.innerText = title;
      overlay.classList.add('active');

      // Запускаем видео после загрузки метаданных
      video.onloadedmetadata = () => {
        video.play().catch(e => console.log('Автовоспроизведение заблокировано браузером'));
      };
    }

    // Закрыть модальное окно
    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      const video = document.getElementById('modal-video');

      overlay.classList.remove('active');
      video.pause();
      video.currentTime = 0;
    }

    // Логика лайка
    function toggleLike(btn) {
      if (btn.innerText === 'Лайк') {
        btn.innerText = 'Нравится';
        btn.style.background = '#fff';
        btn.style.color = '#ff0000';
        btn.style.borderColor = '#ff0000';
      } else {
        btn.innerText = 'Лайк';
        btn.style.background = '#fff';
        btn.style.color = '#333';
        btn.style.borderColor = '#aaa';
      }
    }

    // Логика подписки
    function subscribe() {
      alert('Вы подписаны на канал!');
    }
  </script>
</body>
</html>
